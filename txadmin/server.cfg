## txAdmin deployment values
{{serverEndpoints}}
sv_licenseKey "{{svLicense}}"
sv_maxclients {{maxClients}}
set gamename rdr3
set onesync on
set mysql_connection_string "{{dbConnectionString}}"
set mysql_slow_query_warning 500

## Server identity
sv_hostname "{{serverName}} built with {{recipeName}}"
sets sv_projectName "[{{recipeName}}] {{serverName}}"
sets sv_projectDesc "{{recipeDescription}}"
sets locale "de-DE"
sets tags "redm, roleplay, mscore, western"
set resources_useSystemChat true
set chat_showJoins false
set chat_showQuits false
set txAdmin-menuPtfxDisable true

## Official CFX resources
ensure mapmanager
ensure chat
ensure spawnmanager
ensure redm-map-one
ensure hardcap

## Dependencies must start before MSCore
ensure oxmysql

## MSCore framework
ensure MSCore

## Permissions
add_ace group.admin command allow
add_ace group.admin command.quit deny
add_ace group.admin mscore.admin allow
