<!doctype html>
<html lang="de">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="dark">
    <title>MSCore · Wird geladen</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="loading-screen" aria-label="Server wird geladen">
        <div class="backdrop" aria-hidden="true"></div>
        <div class="grain" aria-hidden="true"></div>

        <header class="brand">
            <span class="brand-mark" aria-hidden="true">MS</span>
            <span>
                <strong id="brandName">MASTERSON STUDIOS</strong>
                <small id="serverName">MSCORE · REDM</small>
            </span>
        </header>

        <section class="welcome">
            <p id="eyebrow" class="eyebrow">WILLKOMMEN IM WESTEN</p>
            <h1 id="screenTitle">Deine Geschichte wartet.</h1>
            <p id="screenSubtitle">Die Verbindung zum Server wird vorbereitet.</p>
        </section>

        <footer class="loading-footer">
            <div class="tip">
                <span>Hinweis</span>
                <p id="tipText">Nach der Charaktererstellung startest du am Bahnhof von Valentine.</p>
            </div>

            <div class="progress-block">
                <div class="progress-copy">
                    <span id="loadingStatus">Verbindung wird vorbereitet</span>
                    <strong id="progressPercent">0%</strong>
                </div>
                <div
                    id="progressTrack"
                    class="progress-track"
                    role="progressbar"
                    aria-label="Ladefortschritt"
                    aria-valuemin="0"
                    aria-valuemax="100"
                    aria-valuenow="0"
                >
                    <span id="progressFill"></span>
                </div>
            </div>
        </footer>
    </main>

    <script src="config.js"></script>
    <script src="app.js"></script>
</body>
</html>
