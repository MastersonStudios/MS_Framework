<!doctype html>
<html lang="de">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="style.css">
    <title>MSCore Guarma</title>
</head>
<body>
    <section id="cinematic" class="cinematic hidden">
        <div class="storm">
            <div class="rain"></div>
            <div class="lightning"></div>
            <svg class="ship" viewBox="0 0 900 360" aria-hidden="true">
                <path class="hull" d="M150 245 Q430 315 735 242 L675 307 Q425 355 205 300 Z"/>
                <path class="mast" d="M432 52 L445 275 L423 275 Z"/>
                <path class="broken-mast" d="M442 128 L585 218 L565 228 L435 153 Z"/>
                <path class="sail" d="M418 72 L260 226 L420 213 Z"/>
                <path class="sail torn" d="M456 86 L610 208 L456 203 Z"/>
                <path class="wave one" d="M0 300 Q130 250 260 302 T520 302 T900 296 V360 H0Z"/>
                <path class="wave two" d="M0 330 Q100 285 220 330 T460 328 T700 330 T950 320 V360 H0Z"/>
            </svg>
        </div>
        <div class="letterbox top"></div>
        <div class="letterbox bottom"></div>
        <div class="caption">
            <p id="cinematic-title"></p>
            <h1 id="cinematic-text"></h1>
        </div>
    </section>

    <section id="tutorial" class="tutorial hidden">
        <div class="progress"><span id="tutorial-progress"></span></div>
        <p class="eyebrow">ÜBERLEBEN AUF GUARMA · <span id="step-count"></span></p>
        <h2 id="tutorial-title"></h2>
        <p id="tutorial-text"></p>
        <div class="tutorial-footer">
            <kbd id="tutorial-key"></kbd>
            <span><strong id="distance">0</strong> Meter bis zum Ziel</span>
        </div>
    </section>

    <aside id="admin-alert" class="admin-alert hidden">
        <span class="alert-icon">!</span>
        <div>
            <p class="eyebrow">NEUER SPIELER AUF GUARMA</p>
            <strong id="alert-name"></strong>
            <small id="alert-command"></small>
        </div>
    </aside>

    <section id="admin-menu" class="admin-menu hidden">
        <div class="menu-shell">
            <header>
                <div>
                    <p class="eyebrow">MSCORE ADMINISTRATION</p>
                    <h2>Guarma-Reise</h2>
                    <p>Wähle ein konfiguriertes Reiseziel.</p>
                </div>
                <button id="close-menu" type="button" aria-label="Schließen">×</button>
            </header>

            <div class="menu-columns">
                <div>
                    <h3>Ziele</h3>
                    <div id="locations" class="location-list"></div>
                </div>
                <div>
                    <h3>Neue Ankömmlinge</h3>
                    <div id="newcomers" class="newcomer-list"></div>
                </div>
            </div>
        </div>
    </section>

    <script src="app.js"></script>
</body>
</html>
