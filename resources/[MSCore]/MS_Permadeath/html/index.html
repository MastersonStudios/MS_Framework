<!doctype html>
<html lang="de">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>MS Permadeath</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <section id="risk-toast" class="risk-toast" aria-live="polite">
        <span class="risk-kicker">PERMANENTES TODESRISIKO</span>
        <strong id="risk-value">0 %</strong>
        <span id="risk-increase">+0 %</span>
    </section>

    <main id="finale" class="finale" aria-hidden="true">
        <div class="vignette"></div>
        <div class="letterbox top"></div>
        <div class="letterbox bottom"></div>
        <div class="finale-copy">
            <span id="test-label" class="test-label">SICHERE TESTSZENE</span>
            <p id="character-name" class="character-name"></p>
            <h1 id="finale-title">Das Ende eines Weges</h1>
            <p id="finale-subtitle" class="subtitle"></p>
            <p id="caption" class="caption"></p>
            <p id="threshold-line" class="threshold-line"></p>
        </div>
    </main>

    <script src="app.js"></script>
</body>
</html>
