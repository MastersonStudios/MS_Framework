<!doctype html>
<html lang="de">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>MS HUD</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main id="hud" class="hud hud--bottom-right hud--horizontal" aria-label="Spielerstatus">
        <section class="status status--health" data-status="health">
            <span class="status__icon" aria-hidden="true">+</span>
            <span class="status__label">Gesundheit</span>
            <span class="status__value">100%</span>
            <span class="status__track" role="progressbar" aria-label="Gesundheit">
                <span class="status__fill"></span>
            </span>
        </section>
        <section class="status status--hunger" data-status="hunger">
            <span class="status__icon" aria-hidden="true">H</span>
            <span class="status__label">Hunger</span>
            <span class="status__value">100%</span>
            <span class="status__track" role="progressbar" aria-label="Hunger">
                <span class="status__fill"></span>
            </span>
        </section>
        <section class="status status--thirst" data-status="thirst">
            <span class="status__icon" aria-hidden="true">D</span>
            <span class="status__label">Durst</span>
            <span class="status__value">100%</span>
            <span class="status__track" role="progressbar" aria-label="Durst">
                <span class="status__fill"></span>
            </span>
        </section>
        <section class="status status--temperature" data-status="temperature">
            <span class="status__icon" aria-hidden="true">°</span>
            <span class="status__label">Temperatur</span>
            <span class="status__value">18 °C</span>
            <span class="status__track" role="progressbar" aria-label="Temperatur">
                <span class="status__fill"></span>
            </span>
        </section>
    </main>
    <script src="app.js"></script>
</body>
</html>
