<!doctype html>
<html lang="de">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>MS Jail</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main id="jail" class="jail jail--top-center" aria-live="polite">
        <span class="jail__eyebrow">Sisika Penitentiary</span>
        <div class="jail__row">
            <span class="jail__seal" aria-hidden="true">S</span>
            <div>
                <span class="jail__caption">Verbleibende Haftzeit</span>
                <strong id="time">00:00</strong>
            </div>
        </div>
        <div class="jail__rule"></div>
        <p id="reason">Keine Begründung angegeben.</p>
        <small id="jailed-by">Inhaftiert durch: System</small>
    </main>
    <script src="app.js"></script>
</body>
</html>
